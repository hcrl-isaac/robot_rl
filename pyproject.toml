[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_rl"
version = "5.4.1"
keywords = ["reinforcement-learning", "robotics"]
maintainers = [
  { name="Clemens Schwarke", email="cschwarke@ethz.ch" },
  { name="Mayank Mittal", email="mittalma@ethz.ch" },
]
authors = [
  { name="Clemens Schwarke", email="cschwarke@ethz.ch" },
  { name="Mayank Mittal", email="mittalma@ethz.ch" },
  { name="Nikita Rudin", email="rudinn@ethz.ch" },
  { name="David Hoeller", email="holler.david78@gmail.com" },
]
description = "Fast and simple RL algorithms implemented in PyTorch"
readme = { file = "README.md", content-type = "text/markdown" }
license = "BSD-3-Clause"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # Exact pin = Isaac Lab 3.0's torch, so every Ray node resolves torch identically (NCCL consistency).
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tensordict>=0.7.0",
    "numpy>=1.16.4",
    "GitPython",
    "onnx",
    "POT==0.9.6",
    "onnxscript>=0.5.4",
    # The log writers subclass torch.utils.tensorboard.SummaryWriter (imported unconditionally), so
    # tensorboard is a hard runtime dep regardless of the chosen logger backend.
    "tensorboard",
]

[project.urls]
Homepage = "https://github.com/Creampelt/robot_rl"
Issues = "https://github.com/Creampelt/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["robot_rl*"]

[tool.setuptools]
license-files = [
    "LICENSE*",
    "licenses/dependencies/*.txt",
]

[tool.pyright]
include = ["robot_rl"]
typeCheckingMode = "basic"
pythonVersion = "3.9"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true
# This is required as the CI pre-commit does not download the module (i.e. numpy, torch, prettytable)
reportMissingImports = "none"
# This is required to ignore type checks of modules with stubs missing.
reportMissingModuleSource = "none"  # -> most common: prettytable in mdp managers
reportGeneralTypeIssues = "none"  # -> usage of literal MISSING in dataclasses
reportOptionalMemberAccess = "none"
reportPrivateUsage = "warning"

[tool.codespell]
ignore-words-list = "ot"
